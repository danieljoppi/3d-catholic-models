name: Ingest uploads

# Drains inbox/ whenever something is pushed into it: files images and models
# into their pieces, inspects meshes for print faults, commits the result.

on:
  push:
    paths:
      - "inbox/**"
  workflow_dispatch:
    inputs:
      create:
        description: "Create pieces named by unmatched files"
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install numpy pillow

      - name: Self-test the mesh tools
        run: tests/test_mesh_tools.sh

      - name: Plan
        run: python scripts/ingest.py --dry-run --create

      - name: Ingest
        run: |
          CREATE=""
          if [ "${{ inputs.create || 'true' }}" = "true" ]; then CREATE="--create"; fi
          python scripts/ingest.py $CREATE

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing was ingested."
          else
            git commit -m "Ingest uploads from inbox/" \
                       -m "Filed by .github/workflows/ingest.yml."
            git push
          fi
