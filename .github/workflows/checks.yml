name: Checks

on:
  push:
    paths:
      - "scripts/**"
      - ".gitignore"
      - "tests/**"
      - "collections/**/metadata.json"
      - ".github/workflows/checks.yml"
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install numpy pillow

      - name: Scripts compile
        run: python -m compileall -q scripts

      - name: No credentials in tracked files
        run: python tests/check_no_secrets.py

      - name: Metadata is valid JSON and matches its folders
        run: python tests/check_metadata.py

      - name: Mesh tool fixtures
        run: tests/test_mesh_tools.sh

      - name: Meshy client parses the documented shapes
        run: python tests/test_meshy.py
