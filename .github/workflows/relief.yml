name: Build relief panel

# Turns one station's reference image into a depth map and a printable relief.
# The depth map is committed back (small, and worth correcting by hand);
# the STL is uploaded as an artifact rather than versioned.

on:
  workflow_dispatch:
    inputs:
      station:
        description: "Station folder, e.g. 12-jesus-dies-on-the-cross"
        required: true
        default: "12-jesus-dies-on-the-cross"
      width_mm:
        description: "Panel width in mm"
        required: true
        default: "150"
      depth_mm:
        description: "Relief depth above the base, in mm"
        required: true
        default: "12"
      resolution:
        description: "Samples across the width"
        required: true
        default: "400"
      commit_depth_map:
        description: "Commit the depth map back to the branch"
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  relief:
    runs-on: ubuntu-latest
    env:
      SET_DIR: collections/stations-of-the-cross/set-01
      STATION: ${{ inputs.station }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Stay on the branch so the depth-map commit can be pushed.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the download to a few hundred MB.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers numpy pillow

      - name: Locate the reference image
        id: ref
        run: |
          REF="$SET_DIR/stations/$STATION/reference/$STATION.jpg"
          if [ ! -f "$REF" ]; then
            echo "No reference image at $REF" >&2
            ls "$SET_DIR/stations" >&2
            exit 1
          fi
          echo "path=$REF" >> "$GITHUB_OUTPUT"
          echo "Using $REF"

      - name: Estimate depth
        run: |
          python scripts/depth_map.py "${{ steps.ref.outputs.path }}" \
            -o "$SET_DIR/stations/$STATION/model/source/$STATION-depth.png"

      - name: Build the relief mesh
        run: |
          mkdir -p out
          python scripts/relief_from_heightmap.py \
            "$SET_DIR/stations/$STATION/model/source/$STATION-depth.png" \
            -o "out/$STATION-${{ inputs.width_mm }}mm.stl" \
            --width-mm "${{ inputs.width_mm }}" \
            --depth-mm "${{ inputs.depth_mm }}" \
            --resolution "${{ inputs.resolution }}" \
            --preview "$SET_DIR/stations/$STATION/renders/$STATION--relief-pass01.png"

      - name: Build a luminance version for comparison
        run: |
          python scripts/relief_from_heightmap.py \
            "${{ steps.ref.outputs.path }}" \
            -o "out/$STATION-${{ inputs.width_mm }}mm-luminance.stl" \
            --width-mm "${{ inputs.width_mm }}" \
            --depth-mm "${{ inputs.depth_mm }}" \
            --resolution "${{ inputs.resolution }}" \
            --luminance

      - name: Upload meshes
        uses: actions/upload-artifact@v4
        with:
          name: relief-${{ inputs.station }}
          path: |
            out/*.stl
            ${{ env.SET_DIR }}/stations/${{ inputs.station }}/model/source/*-depth.png
            ${{ env.SET_DIR }}/stations/${{ inputs.station }}/renders/*-relief-pass01.png
          retention-days: 30

      - name: Commit the depth map
        if: inputs.commit_depth_map == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SET_DIR/stations/$STATION/model/source/$STATION-depth.png" \
                  "$SET_DIR/stations/$STATION/renders/$STATION--relief-pass01.png"
          if git diff --cached --quiet; then
            echo "Depth map unchanged."
          else
            git commit -m "Add depth map and relief preview for $STATION

          Generated by .github/workflows/relief.yml. Wants correcting by hand
          before meshing — see docs/making-the-models.md."
            git push
          fi
